name: Test App Inventor Build Server

on:
  workflow_dispatch:

jobs:
  buildserver-test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Install Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant

      - name: Clone MIT App Inventor source
        run: |
          git clone --depth 1 --recurse-submodules \
            https://github.com/mit-cml/appinventor-sources.git \
            appinventor-sources

      - name: Initialize submodules
        working-directory: appinventor-sources
        run: |
          git submodule update --init --recursive

      - name: Create App Inventor auth key
        working-directory: appinventor-sources/appinventor
        run: |
          ant MakeAuthKey

      - name: Build App Inventor Build Server
        working-directory: appinventor-sources/appinventor/buildserver
        run: |
          ant BuildServer

      - name: Test Build Server
        working-directory: appinventor-sources/appinventor/buildserver
        run: |
          ant tests

      - name: Finished
        run: |
          echo "======================================"
          echo "App Inventor Build Server test finished"
          echo "======================================"
